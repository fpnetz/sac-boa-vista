<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.9/build/pdfmake.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.9/build/vfs_fonts.js"></script>
<title>SAC - BOA VISTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F7FB; --surface:#FFFFFF; --surface-2:#EAF2FA; --ink:#13202C; --muted:#57697A; --line:#D7E3EE;
  --brand:#0086CE; --blue:#2A4D8F; --blue-text:#2A4D8F; --blue-soft:#E2EEFA;
  --amber:#8A5200; --amber-soft:#FCEFD3; --green:#1D6B4A; --green-soft:#DDF1E7;
  --red:#B3261E; --red-soft:#FDE4E2; --bubble-client:#E7EFF6; --violet:#B5651D; --violet-soft:#FBE8D9;
  --navy:#0B4A75; --navy-soft:#D7E6F2;
  --shadow:0 1px 2px rgba(19,34,46,.06),0 10px 30px rgba(19,34,46,.08); --overlay:rgba(12,22,30,.5);
  --ff:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B151E; --surface:#111D28; --surface-2:#17242F; --ink:#E7EEF5; --muted:#93A7B8; --line:#243644;
    --brand:#36B2EB; --blue:#7FA3DE; --blue-text:#9CC1F2; --blue-soft:#1C2E47;
    --amber:#F0B44C; --amber-soft:#3A2C10; --green:#5FD09A; --green-soft:#12301F;
    --red:#FF8A80; --red-soft:#3A1917; --bubble-client:#1E2E3B; --violet:#E3A567; --violet-soft:#3A2A14;
    --navy:#3E6FA8; --navy-soft:#1B2A3A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); --overlay:rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B151E; --surface:#111D28; --surface-2:#17242F; --ink:#E7EEF5; --muted:#93A7B8; --line:#243644;
  --brand:#36B2EB; --blue:#7FA3DE; --blue-text:#9CC1F2; --blue-soft:#1C2E47;
  --amber:#F0B44C; --amber-soft:#3A2C10; --green:#5FD09A; --green-soft:#12301F;
  --red:#FF8A80; --red-soft:#3A1917; --bubble-client:#1E2E3B; --violet:#E3A567; --violet-soft:#3A2A14;
  --navy:#3E6FA8; --navy-soft:#1B2A3A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); --overlay:rgba(0,0,0,.62);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px}
.brand .t1{font-weight:600;font-size:16px;line-height:1.2}
.brand .t2{color:var(--muted);font-size:13px}
.logo{display:block;width:auto;max-width:none}
.sub-brand{color:var(--muted);font-size:13px;border-left:1px solid var(--line);padding-left:12px;line-height:1.2}
.login-card h1{font-size:20px;margin:24px 0 4px;font-weight:600}
.login-card p{margin:0 0 20px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:500;color:var(--muted)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:40px}
.inp::placeholder{color:var(--muted);opacity:.8}
textarea.inp{resize:vertical;min-height:96px}
.err{color:var(--red);font-size:13px;min-height:18px;margin:-4px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.block{width:100%}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--red)}
.fine{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}


/* login v2 (SAC Boa Vista brand screen) */
.login2{min-height:100vh;position:relative;display:flex;overflow:hidden;background:#0E4A52}
.login2-photo{position:relative;width:62%;height:100vh;overflow:hidden;flex:none}
.login2-bg{position:absolute;top:50%;right:0;height:100%;width:auto;max-width:none;transform:translateY(-50%)}
.login2-veil{position:absolute;inset:0;z-index:1;
  background:linear-gradient(100deg,
    rgba(10,54,60,0) 0%,
    rgba(10,54,60,.18) 30%,
    rgba(10,54,60,.55) 48%,
    rgba(10,54,60,.88) 60%,
    #0E4A52 72%,
    #0E4A52 100%)}
.login2-caption{position:absolute;left:min(6vw,56px);bottom:min(8vh,56px);color:#fff;z-index:2;max-width:480px}
.login2-caption .eyebrow{display:block;font-size:clamp(18px,2vw,32px);font-weight:900;letter-spacing:.01em;text-transform:uppercase;color:#0086CE;margin-bottom:12px}
.login2-caption h2{font-size:clamp(18px,1.6vw,30px);font-weight:800;line-height:1.25;color:#fff;margin:0}
.login2-panel{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px clamp(28px,5vw,90px);min-width:0}
.login2-theme{position:absolute;top:14px;right:16px}
.login2-theme.icon-btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.login2-theme.icon-btn:hover{background:rgba(255,255,255,.18)}
.brandmark2{margin-bottom:36px}
.sac-lockup2{height:clamp(26px,2.6vw,38px);width:auto;display:block;margin-bottom:10px}
.logo2{height:clamp(52px,5vw,76px);display:block}
.login2-panel h1{font-size:clamp(20px,2vw,27px);font-weight:800;color:#fff;margin:0 0 8px}
.login2-panel p{color:#bcd6cb;font-size:15px;margin:0 0 30px}
.login2-panel .field label{color:#6fd6e0}
.login2-panel .inp{background:rgba(255,255,255,.11);border:1.5px solid rgba(255,255,255,.22);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 14px rgba(0,0,0,.22)}
.login2-panel .inp::placeholder{color:#9fc3c9}
.login2-panel .err{color:#ffb4b0}
.login2-panel .btn.primary{background:linear-gradient(90deg,#0086CE,#0A363C);border:none;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.login2-panel .fine{color:#9fc3c9}
.login2-form{width:100%;max-width:420px}
@media (max-width:880px){
  .login2{flex-direction:column}
  .login2-photo{display:none}
  .login2-panel{width:100%;padding:48px 24px;align-items:center}
  .login2-form{max-width:380px}
  .brandmark2{display:flex;flex-direction:column;align-items:flex-start}
}

/* topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip-admin{display:inline-flex;align-items:center;gap:6px;background:var(--blue-soft);color:var(--blue-text);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.chip-admin .i{width:15px;height:15px}
.chip-user{font-weight:500;padding:0 6px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}
.theme-fab{position:fixed;top:14px;right:16px;z-index:5}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:8px 10px;border-radius:8px;font-weight:500}
.nav-btn:hover{background:var(--surface-2)}

.wrap{max-width:1200px;margin:0 auto;padding:28px 16px 56px}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600;margin:0}
.page-head h1 .i{color:var(--brand);width:26px;height:26px}
.page-head .sub{color:var(--muted);margin:2px 0 0 38px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat:hover{border-color:var(--muted)}
.stat[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.stat .n{font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}
.dot.analise{background:var(--violet)} .dot.atendimento{background:var(--amber)} .dot.encerrado{background:var(--green)}
.stat .l{order:-1}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.filters .inp{width:auto;min-width:150px}
.filters .grow{flex:1 1 220px;max-width:340px}
.filters select.inp{padding-right:28px}

/* table */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:960px}
th{text-align:left;font-weight:500;color:var(--muted);padding:14px 14px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
.proto{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.city{color:var(--muted);white-space:nowrap}
.rep-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
.rep-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 6px}
.rep-tile{background:var(--surface-2);border-radius:10px;padding:10px 14px}
.rep-tile .n{font-size:24px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.rep-tile .l{color:var(--muted);font-size:12.5px}
.rep h3{font-size:13.5px;font-weight:600;margin:18px 0 8px}
.rep-tbl{width:100%;min-width:520px;border-collapse:collapse}
.rep-tbl th{font-size:12.5px;padding:8px 10px}
.rep-tbl td{padding:9px 10px;font-variant-numeric:tabular-nums}
.rep-tbl td.n,.rep-tbl th.n{text-align:right}
.rep-tbl tr{cursor:default}.rep-tbl tbody tr:hover{background:none}
.rep-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.sbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);min-width:120px}
.sbar i{display:block;height:100%}
.sbar .b4{background:var(--violet)}.sbar .b1{background:var(--blue)}.sbar .b2{background:var(--amber)}.sbar .b3{background:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:8px 0 0}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--blue)}
.legend .l4::before{background:var(--violet)}
.legend .l2::before{background:var(--amber)}.legend .l3::before{background:var(--green)}
.cat-sec{padding:4px 20px 8px}
.cat-sec h3{font-size:13.5px;font-weight:600;margin:14px 0 8px}
.cat-list{list-style:none;margin:0 0 10px;padding:0;border:1px solid var(--line);border-radius:10px;max-height:190px;overflow-y:auto}
.cat-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line)}
.cat-list li:last-child{border-bottom:0}
.cat-list .none{color:var(--muted);justify-content:flex-start}
.cat-list button{background:none;border:0;color:var(--red);font-size:12.5px;padding:2px 4px}
.cat-add{display:flex;gap:8px}
.note{color:var(--muted);font-size:12.5px;margin:4px 0 0}
.subj .s1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
.subj .s2{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
.when{color:var(--muted);white-space:nowrap}
.open .link{background:none;border:0;font-weight:500;padding:6px 4px}
.ex{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.pill{display:inline-block;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.type-reclamacao{background:var(--red-soft);color:var(--red)}
.type-solicitacao{background:var(--blue-soft);color:var(--blue-text)}
.type-duvida{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.type-sugestao{background:var(--green-soft);color:var(--green)}
.pill.st{border-radius:999px;padding:3px 12px;font-weight:600}
.st-aberto{background:var(--blue);color:#fff}
.st-analise{background:var(--violet-soft);color:var(--violet)}
.st-atendimento{background:var(--amber-soft);color:var(--amber)}
.st-encerrado{background:var(--green-soft);color:var(--green)}
.pill.flag{border-radius:999px;padding:3px 12px;font-weight:600;background:var(--amber-soft);color:var(--amber);border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill.flag:hover{filter:brightness(0.96)}
.pill.flag.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.flag.mini{cursor:default;padding:2px 9px;font-size:11px;font-weight:600;margin-left:6px;vertical-align:1px}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.modal.sm{max-width:420px}
.modal.wide{max-width:920px}
.m-head{padding:18px 20px 12px;position:relative}
.m-head .tags{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.m-head h2{margin:0 36px 4px 0;font-size:17px;font-weight:600}
.m-head .meta{color:var(--muted);font-size:13px}
.m-head .meta .proto{color:var(--muted)}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;display:grid;place-items:center;border:1.5px solid var(--blue);border-radius:8px;background:var(--surface);color:var(--blue-text)}
.x:hover{background:var(--blue-soft)}
.m-body{padding:4px 20px 12px;overflow-y:auto;flex:1;min-height:120px}
.form-body{padding:8px 20px 4px;overflow-y:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sep{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;margin:16px 0 10px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:flex;flex-direction:column;margin-bottom:12px;max-width:100%}
.msg .meta{font-size:12px;color:var(--muted);margin-bottom:4px}
.msg.staff.me{align-items:flex-end}
.msg.staff.other{align-items:flex-start}
.msg.staff .meta .del{background:none;border:0;color:var(--red);padding:0 0 0 6px;font-size:12px}
.bubble{padding:10px 14px;border-radius:14px;max-width:88%;overflow-wrap:anywhere;white-space:pre-wrap}
.client .bubble{background:var(--bubble-client);border-bottom-left-radius:4px}
.staff.me .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.staff.other .bubble{background:var(--navy);color:#fff;border-bottom-left-radius:4px}
.sys{text-align:center;color:var(--muted);font-size:12.5px;margin:12px 0}
.atts{display:flex;flex-direction:column;gap:6px;margin-top:8px;align-items:flex-start;white-space:normal}
.att{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:6px 10px;font-size:13px;border:1px solid rgba(127,140,150,.4);background:rgba(127,140,150,.14);color:inherit;max-width:100%;text-align:left}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .sz{opacity:.7;font-size:12px}
.att-img{border:0;padding:0;background:none;border-radius:8px;overflow:hidden;display:block}
.att-img img{display:block;max-width:240px;max-height:200px;border-radius:8px}
.att-img.loading{width:120px;height:80px;background:rgba(127,140,150,.25)}
.att-audio{display:block;max-width:100%}
.att-audio audio{display:block;height:34px;max-width:260px}
.att-audio.loading{width:220px;height:34px;background:rgba(127,140,150,.25);border-radius:17px}
.composer{border-top:1px solid var(--line);padding:12px 20px 16px;background:var(--surface)}
.composer textarea{min-height:76px}
.c-actions{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.c-actions .sp{flex:1}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border:0;background:none;border-radius:8px;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px;font-size:12.5px;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.chip button{border:0;background:none;color:var(--muted);width:20px;height:20px;border-radius:50%;line-height:1;padding:0}
.chip button:hover{background:var(--line)}
.dtf{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}.dtf .inp{width:auto}
/* panorama */
.pan{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--sO:#a9a8a1;--seq-lo:#cde2fb;--seq-hi:#0d366b;--lbl-hi:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pan{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--sO:#6d6c66;--seq-lo:#184f95;--seq-hi:#b7d3f6;--lbl-hi:#0b1a2b}}
:root[data-theme="dark"] .pan{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--sO:#6d6c66;--seq-lo:#184f95;--seq-hi:#b7d3f6;--lbl-hi:#0b1a2b}
.pan{position:relative}
.pan-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;margin-top:10px}
@media (max-width:820px){.pan-grid{grid-template-columns:1fr}}
.pan-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pan-wide{margin-top:14px}
.pan-card h3{font-size:14px;font-weight:600;margin:0 0 8px}
.pan-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}.pan-h h3{margin:0}
.pan-map{width:100%;height:auto;max-height:460px;display:block}
.pan-map .uf{stroke:var(--surface);stroke-width:1;stroke-linejoin:round;cursor:default;transition:opacity .12s}
.pan-map .uf:hover{opacity:.82}
.pan-map .uf.sel{stroke:var(--ink);stroke-width:2}
.pan-map .uf[tabindex="0"]{cursor:pointer}
.uf-lbl text{font-size:12px;font-weight:600;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:2.5px;stroke-linejoin:round}
.uf-lbl text.on-dark{fill:var(--lbl-hi);stroke:none}
.pan-scale{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-top:6px}
.pan-scale i{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--seq-hi) 18%,var(--seq-lo)),var(--seq-hi))}
.pan-city{margin-top:12px}.pan-city-h{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}.pan-city-h span{color:var(--muted)}
.pan-det{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.pan-det ul{list-style:none;margin:6px 0 0;padding:0}.pan-det li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 11px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue-text)}
.pie-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pie{width:min(230px,100%);flex:0 0 auto}
.pie-s{stroke:var(--surface);stroke-width:2;transition:opacity .12s}.pie-s:hover{opacity:.82}
.pie-leg{list-style:none;margin:0;padding:0;flex:1 1 170px;min-width:0}
.pie-leg li{display:grid;grid-template-columns:12px minmax(0,1fr) auto 42px;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.pie-leg i{width:10px;height:10px;border-radius:50%;display:block}
.pie-leg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pie-leg em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.pl{width:100%;height:auto;display:block;touch-action:none}
.pl-grid{stroke:var(--line);stroke-width:1}.pl-grid.base{stroke:var(--muted);stroke-opacity:.5}
.pl-ax{font-size:11px;fill:var(--muted)}
.pl-line{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pl-line.s1,.pl-dot.s1{stroke:var(--s1)}.pl-line.s2,.pl-dot.s2{stroke:var(--s2)}
.pl-dot{stroke-width:2;paint-order:stroke}.pl-dot.s1{fill:var(--s1);stroke:var(--surface)}.pl-dot.s2{fill:var(--s2);stroke:var(--surface)}
.pl-end{font-size:12px;font-weight:500;fill:var(--ink)}
.pl-cur{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.pan-key{display:flex;gap:16px;font-size:12.5px;color:var(--muted)}
.pan-key i,.pan-tip i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.pan-key i.k1,.pan-tip i.k1{background:var(--s1)}.pan-key i.k2,.pan-tip i.k2{background:var(--s2)}
.pan-key b{color:var(--ink)}
.pan-tip{position:absolute;z-index:5;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:12.5px;line-height:1.5;pointer-events:none;box-shadow:var(--shadow);white-space:nowrap}
.pan-tbl{margin-top:14px}.pan-tbl summary{cursor:pointer;color:var(--blue-text);font-weight:500;font-size:13px}
.city-uf{display:flex;align-items:center;gap:8px}.city-uf select{width:auto;min-height:30px;padding:2px 6px;font-size:12.5px}

.linkbtn{background:none;border:0;color:var(--blue-text);font-size:13px;padding:0;font-weight:500}
.client-mode{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.m-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px 18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;max-width:calc(100% - 32px);font-size:13.5px;box-shadow:var(--shadow)}
dl.data{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;padding:8px 20px 4px}
dl.data dt{color:var(--muted)} dl.data dd{margin:0;font-weight:500;overflow-wrap:anywhere}

@media (max-width:680px){
  .rep-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hide-sm{display:none}
  .topbar .sub-brand{display:none}
  .stats{gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{padding:12px}
  .stat .n{font-size:24px}
  .two{grid-template-columns:1fr}
  .overlay{padding:0;align-items:stretch}
  .modal{max-width:none;border-radius:0;height:100%}
  .modal.sm{height:auto;align-self:center;margin:16px;border-radius:14px;width:auto}
  .page-head .sub{margin-left:0}
  .bubble{max-width:94%}
}
@media (prefers-reduced-motion:no-preference){
  .modal{animation:pop .16s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}

/* ───────── exportação em PDF (via impressão do navegador) ───────── */
.print-header{display:none;background:#151f28;padding:10px 16px;border-radius:8px;align-items:center;gap:10px;margin-bottom:14px}
.print-header img{height:26px;display:block}
.print-header span{color:#fff;font:600 13px/1.3 Inter,system-ui,sans-serif}
@media print{
  /* esconde toda a aplicação e todas as janelas; só a que está sendo exportada aparece */
  #app{display:none!important}
  .overlay{display:none!important}
  .overlay.printing{display:block!important;position:static!important;inset:auto!important;
    width:auto!important;max-width:none!important;height:auto!important;max-height:none!important;
    overflow:visible!important;box-shadow:none!important;border-radius:0!important;
    padding:0!important;margin:0!important;background:#fff!important;z-index:auto!important;
    align-items:normal!important;justify-content:normal!important;
    /* força paleta clara/marca no impresso, independente do tema em tela */
    --bg:#fff!important; --surface:#fff!important; --surface-2:#f2f6f7!important;
    --ink:#151f28!important; --muted:#4d5c64!important; --line:#d7e0e2!important;
    --brand:#0c8289!important; --blue:#00959f!important; --blue-text:#00959f!important; --blue-soft:#e6f5f6!important;
    --amber:#9a5b00!important; --amber-soft:#fbead0!important; --green:#136b46!important; --green-soft:#dcf1e6!important;
    --red:#a32219!important; --red-soft:#fbe1de!important; --violet:#4a3aa7!important; --violet-soft:#e9e4fb!important;
    --bubble-client:#eef2f4!important; color:#151f28!important}
  .printing .modal{position:static!important;width:100%!important;max-width:none!important;max-height:none!important;
    height:auto!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;
    background:#fff!important;display:block!important;padding:0!important;margin:0!important}
  .printing .m-body,.printing .m-body.pan,.printing .m-body.rep{overflow:visible!important;max-height:none!important;
    height:auto!important;flex:none!important;min-height:0!important;padding:0!important;display:block!important}
  .printing .m-head{padding:0 0 10px!important;position:static!important}
  .printing .no-print{display:none!important}
  .printing #dWppNote{display:block!important;background:#e6f5f6;border:1px solid #bfe6e8;color:#0c5257;
    padding:8px 10px;border-radius:8px;margin-top:10px}
  .print-header{display:flex!important}

  /* título do relatório/chamado no estilo dos modelos */
  .printing .m-head h2,.printing h2{color:#0c8289!important;font-size:18px!important;margin:0 0 4px!important}
  .printing .m-head .meta,.printing .meta{color:#4d5c64!important;font-size:12px!important;padding-bottom:8px!important;
    border-bottom:1px solid #d7e0e2!important;margin-bottom:10px!important}
  .printing .tags{margin-bottom:8px!important}

  /* tiles de KPI (Relatórios/Produtividade) no estilo dos cartões dos modelos */
  .printing .rep-tiles{gap:10px!important}
  .printing .rep-tile{background:#f2f6f7!important;border:1px solid #d7e0e2!important;border-radius:8px!important;
    padding:10px 12px!important;border-top:3px solid #00959f!important}
  .printing .rep-tile .n{color:#151f28!important}
  .printing .rep-tile .l{color:#4d5c64!important}

  /* tabelas no estilo dos modelos: cabeçalho escuro, linhas com fio, zebra leve */
  .printing table,.printing .rep-tbl{border:1px solid #d7e0e2!important}
  .printing table th,.printing .rep-tbl th{background:#151f28!important;color:#fff!important;
    font-weight:600!important;border-bottom:0!important;padding:8px 10px!important}
  .printing table td,.printing .rep-tbl td{border-bottom:1px solid #e3e9ea!important;padding:7px 10px!important}
  .printing table tbody tr:nth-child(even) td,.printing .rep-tbl tbody tr:nth-child(even) td{background:#f7fafa!important}
  .printing .tbl-wrap,.printing .rep-scroll{border:1px solid #d7e0e2!important;border-radius:8px!important;overflow:visible!important}
  .printing table,.printing .rep-tbl{min-width:0!important;width:100%!important;table-layout:auto!important}

  /* badges de tipo/status */
  .printing .pill{border:1px solid #d7e0e2!important}
  .printing .pill.st{border:0!important;color:#fff!important}
  .printing .st-aberto{background:#00959f!important}
  .printing .st-analise{background:#5b6ee1!important}
  .printing .st-atendimento{background:#9a5b00!important}

  /* Panorama: cartões e legendas */
  .printing .pan-card{background:#fff!important;border:1px solid #d7e0e2!important;border-radius:8px!important}
  .printing .pan-card h3{color:#151f28!important}
  .printing .pie-leg em{color:#4d5c64!important}

  @page{margin:10mm}
}

/* ───────── configuração ───────── */
// PROTÓTIPO: a verificação de login acontece dentro da página (não em um servidor).
// A administradora abaixo é fixa; os demais usuários são cadastrados por ela e ficam no banco da página,
// os usuários e senhas ficam no Supabase (Auth + tabela profiles); aqui só o rótulo do perfil.
const ROLE_LABEL = { admin:'Administradora', atendente:'Atendente' };
const AUTH_URL = 'https://ep-floral-star-beuw3qet.neonauth.c-9.us-east-2.aws.neon.tech/neondb/auth';
const DATA_API = 'https://ep-floral-star-beuw3qet.apirest.c-9.us-east-2.aws.neon.tech/neondb/rest/v1';
const usernameToEmail = u => `${u}@suporte.boavista`;

/* ───────── Neon Auth (Managed Better Auth) + Data API, via fetch puro ─────────
   A sessão usa o cookie HttpOnly definido pelo próprio Neon Auth (SameSite=None;
   Secure; Partitioned), por isso toda chamada precisa de credentials:'include'. */
async function authFetch(path, opts={}){
  const r = await fetch(AUTH_URL + path, {
    method: opts.method || 'GET',
    credentials: 'include',
    headers:{ 'Content-Type':'application/json', ...(opts.headers||{}) },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
  });
  const out = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(out?.message || out?.error || 'Não foi possível concluir a operação.');
  return out;
}
let _jwt = null, _jwtExp = 0;
async function getJwt(force){
  if(!force && _jwt && Date.now() < _jwtExp) return _jwt;
  const out = await authFetch('/token');
  _jwt = out.token; _jwtExp = Date.now() + 11*60*1000;
  return _jwt;
}
async function dataFetch(path, opts={}, retry){
  const jwt = await getJwt();
  const r = await fetch(DATA_API + path, {
    method: opts.method || 'GET',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+jwt, 'Prefer': opts.prefer || 'return=representation', ...(opts.headers||{}) },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
  });
  if(r.status === 401 && !retry){ await getJwt(true); return dataFetch(path, opts, true); }
  if(r.status === 204) return null;
  const out = await r.json().catch(()=>null);
  if(!r.ok) throw new Error(out?.message || 'Não foi possível concluir a operação.');
  return out;
}
const selectAll = async (table, filter='') => (await dataFetch(`/${table}?select=*${filter?('&'+filter):''}`)) || [];
const selectOne = async (table, filter) => { const rows = await selectAll(table, filter); return rows[0] || null; };
const insertRow = async (table, row) => { const rows = await dataFetch(`/${table}`, { method:'POST', body:row }); return Array.isArray(rows) ? rows[0] : rows; };
const updateRows = (table, filter, patch) => dataFetch(`/${table}?${filter}`, { method:'PATCH', body:patch });
const deleteRows = (table, filter) => dataFetch(`/${table}?${filter}`, { method:'DELETE', headers:{ 'Prefer':'return=minimal' } });
const rpcCall = (fn, args={}) => dataFetch(`/rpc/${fn}`, { method:'POST', body:args });

async function signIn(username, password){
  const out = await authFetch('/sign-in/email', { method:'POST', body:{ email: usernameToEmail(username), password } });
  if(!out?.token) throw new Error('Usuário ou senha incorretos.');
  _jwt = null; _jwtExp = 0;
  return out.user;
}
async function verifyPassword(username, password){
  try{ const r = await fetch(AUTH_URL + '/sign-in/email', { method:'POST', credentials:'include', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ email: usernameToEmail(username), password }) }); return r.ok; }
  catch(_){ return false; }
}
async function signOutAuth(){
  try{ await authFetch('/sign-out', { method:'POST', body:{} }); }catch(_){}
  _jwt = null; _jwtExp = 0;
}
async function getSessionUser(){
  try{ const out = await authFetch('/get-session'); return out?.user || null; }
  catch(_){ return null; }
}
const adminApi = {
  createUser: (email,password,name) => authFetch('/admin/create-user', { method:'POST', body:{ email, password, name, role:'user' } }),
  setUserPassword: (userId,newPassword) => authFetch('/admin/set-user-password', { method:'POST', body:{ userId, newPassword } }),
  removeUser: (userId) => authFetch('/admin/remove-user', { method:'POST', body:{ userId } })
};
const DEFAULT_TYPES = ['Reclamação','Solicitação','Dúvida','Sugestão'];
const TYPE_SLUG = {'Reclamação':'reclamacao','Solicitação':'solicitacao','Dúvida':'duvida','Sugestão':'sugestao'};

function printReport(el, title, subtitle){
  const hdr = document.createElement('div');
  hdr.className = 'print-header';
  hdr.innerHTML = `<img src="${LOGO_B64}" alt="Boa Vista"><span>${esc(title)}${subtitle?' — '+esc(subtitle):''}</span>`;
  el.prepend(hdr);
  el.classList.add('printing');
  const cleanup = () => { el.classList.remove('printing'); hdr.remove(); window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  setTimeout(() => window.print(), 60);
}

/* ───────── exportação em PDF real (pdfmake), no layout dos modelos aprovados ───────── */
const PDFC = { NAVY:'#0B2A3D', TEAL:'#0086CE', BLUE:'#2563eb', LIGHT_BLUE:'#e8f4fc', GREEN:'#16a34a',
  AMBER:'#d97706', RED:'#dc2626', VIOLET:'#b5651d', GRAY:'#6b7280', LIGHT_GRAY:'#f3f4f6', BORDER:'#d1d5db',
  STAFF_BUBBLE:'#eaf7ee', NOTICE_BG:'#e8f4fc', NOTICE_BORDER:'#bfe0f5', NOTICE_TEXT:'#0a4a66' };
const PDF_STATUS_COLOR = { aberto:PDFC.BLUE, atendimento:PDFC.AMBER, analise:PDFC.VIOLET, encerrado:PDFC.GREEN };
const PDF_TYPE_COLOR = { 'Reclamação':'#0086CE', 'Solicitação':'#d97706', 'Dúvida':'#5b6ee1', 'Sugestão':'#b3261e' };
const CM = 28.3465;

function pdfNow(){ const d = new Date(); return `${dmy(d.toISOString())} às ${pad(d.getHours())}:${pad(d.getMinutes())}`; }

function pdfHeaderContent(title, subtitleLines){
  return [
    { table:{ widths:['*','auto'], body:[[
        { image:LOGO_B64, width:92 },
        { text:'Central de Atendimento', color:'#ffffff', fontSize:9, alignment:'right', margin:[0,7,0,0] }
      ]]},
      layout:{ hLineWidth:()=>0, vLineWidth:()=>0, paddingLeft:()=>14, paddingRight:()=>14, paddingTop:()=>9, paddingBottom:()=>9,
        fillColor:()=>PDFC.NAVY },
      margin:[0,0,0,14] },
    { text:title, fontSize:17, bold:true, color:PDFC.NAVY, margin:[0,0,0,2] },
    ...subtitleLines.map(l => ({ text:l, fontSize:9.5, color:PDFC.GRAY })),
    { canvas:[{ type:'line', x1:0, y1:0, x2:493, y2:0, lineWidth:1, lineColor:PDFC.BORDER }], margin:[0,8,0,10] }
  ];
}

function pdfKpiRow(items){
  return { columns: items.map(([label, value, color]) => ({
    table:{ widths:['*'], body:[
      [{ text:String(value), fontSize:16, bold:true, color, alignment:'center', margin:[0,8,0,2] }],
      [{ text:label, fontSize:7.6, color:PDFC.GRAY, alignment:'center', margin:[0,0,0,8] }]
    ]},
    layout:{ hLineWidth:(i)=> (i===0||i===2) ? 0.75 : 0, vLineWidth:()=>0.75, hLineColor:()=>PDFC.BORDER, vLineColor:()=>PDFC.BORDER,
      paddingLeft:()=>4, paddingRight:()=>4, paddingTop:()=>0, paddingBottom:()=>0, fillColor:()=>PDFC.LIGHT_GRAY }
  })), columnGap:8, margin:[0,0,0,18] };
}

function pdfH2(text){ return { text, fontSize:12, bold:true, color:PDFC.TEAL, margin:[0,14,0,6] }; }

function pdfPct(n, total){ return total ? (n/total*100).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%' : '0,0%'; }

function pdfFixedWidths(arr, pad=6){
  // pdfmake adds cell padding ON TOP of a fixed numeric column width when rendering,
  // so a fixed width must be reduced by its own padding up front or the table overflows the page.
  return arr.map(w => typeof w === 'number' ? Math.max(14, w - pad*2) : w);
}

function pdfStyledTable(headers, rows, opts={}){
  const widths = pdfFixedWidths(opts.widths || headers.map(()=> '*'));
  const align = opts.align || ((i)=> i===0?'left':'center');
  const body = [ headers.map((h,i)=>({ text:h, bold:true, color:'#fff', fontSize:9, fillColor:PDFC.NAVY, alignment: opts.headAlign ? opts.headAlign(i) : align(i) })) ];
  rows.forEach((r, ri) => {
    const isTotals = opts.totalsIndex!=null && ri === opts.totalsIndex;
    body.push(r.map((c, ci) => {
      const cell = (c && typeof c === 'object' && !Array.isArray(c)) ? { ...c } : { text: String(c==null?'':c) };
      if(cell.fontSize==null) cell.fontSize = 9;
      if(cell.alignment==null) cell.alignment = align(ci);
      if(isTotals){ cell.bold = true; cell.fillColor = PDFC.LIGHT_BLUE; }
      else if(cell.fillColor==null) cell.fillColor = (ri % 2 === 1) ? PDFC.LIGHT_GRAY : '#ffffff';
      return cell;
    }));
  });
  return { table:{ headerRows:1, widths, body },
    layout:{ hLineWidth:()=>0.5, vLineWidth:()=>0.5, hLineColor:()=>PDFC.BORDER, vLineColor:()=>PDFC.BORDER,
      paddingTop:()=>6, paddingBottom:()=>6, paddingLeft:()=>6, paddingRight:()=>6 } };
}

function pdfBubble(author, when, text, bg){
  return { table:{ widths:['*'], body:[
      [{ text:[{text:author+' — ', bold:true, fontSize:8.5, color:PDFC.GRAY},{text:when, fontSize:8.5, color:PDFC.GRAY}] }],
      [{ text:text||'', fontSize:9.5, color:'#111827', margin:[0,2,0,0] }]
    ]},
    layout:{ hLineWidth:()=>0.5, vLineWidth:()=>0.5, hLineColor:()=>PDFC.BORDER, vLineColor:()=>PDFC.BORDER,
      paddingLeft:()=>9, paddingRight:()=>9, paddingTop:()=>6, paddingBottom:()=>6, fillColor:()=>bg },
    margin:[0,0,0,6] };
}

function pdfSysLine(text, when){
  return { text:`${text} · ${when}`, fontSize:8.5, color:PDFC.GRAY, alignment:'center', margin:[0,2,0,8] };
}

function pdfFooter(sub){
  return (page, count) => ({
    columns:[
      { text:'Gerado automaticamente pelo sistema de Chamados — Boa Vista', fontSize:7.5, color:PDFC.GRAY },
      { text:`Página ${page} de ${count}`, fontSize:7.5, color:PDFC.GRAY, alignment:'right' }
    ],
    margin:[51,10,51,0]
  });
}

function pdfDoc(content){
  return { pageSize:'A4', pageMargins:[51,40,51,60], footer:pdfFooter(), content };
}

function pdfDownload(docDefinition, filename){
  try{ pdfMake.createPdf(docDefinition).download(filename); }
  catch(e){ console.error(e); toast('Não foi possível gerar o PDF. Tente novamente.'); }
}

/* gráfico de linhas suavizado (desenhado em canvas, sem depender de libs externas) */
function pdfLineChartPNG(series){
  const W = 1200, H = 460, padL = 50, padR = 20, padT = 54, padB = 40;
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
  const n = series[0]?.values.length || 0;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const maxY = Math.max(1, ...series.flatMap(s=>s.values.map(v=>v.y)));
  const niceMax = Math.max(4, Math.ceil(maxY/4)*4);
  const xAt = i => padL + (n<=1?0:(plotW*i/(n-1)));
  const yAt = v => padT + plotH - (v/niceMax)*plotH;
  ctx.strokeStyle = '#e3e9ea'; ctx.lineWidth = 1; ctx.font = '20px Arial, sans-serif';
  for(let g=0; g<=4; g++){
    const v = niceMax*g/4, y = yAt(v);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-padR, y); ctx.stroke();
    ctx.fillStyle = '#6b7280'; ctx.textAlign = 'right'; ctx.fillText(String(Math.round(v)), padL-8, y+6);
  }
  ctx.textAlign = 'center';
  const step = Math.max(1, Math.round(n/7));
  for(let i=0;i<n;i+=step){ ctx.fillText(series[0].values[i].x, xAt(i), H-12); }
  let lx = padL;
  ctx.font = 'bold 20px Arial, sans-serif';
  series.forEach(s => {
    ctx.fillStyle = s.color; ctx.fillRect(lx, padT-34, 16, 16);
    ctx.fillStyle = '#151f28'; ctx.textAlign = 'left'; ctx.fillText(s.label, lx+22, padT-22);
    lx += 22 + ctx.measureText(s.label).width + 30;
  });
  series.forEach(s => {
    const pts = s.values.map((v,i)=>({x:xAt(i), y:yAt(v.y)}));
    if(pts.length < 2) return;
    const curve = (ctxp) => { ctxp.moveTo(pts[0].x, pts[0].y);
      for(let i=0;i<pts.length-1;i++){ const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2; ctxp.quadraticCurveTo(pts[i].x,pts[i].y,mx,my); }
      ctxp.lineTo(pts[pts.length-1].x, pts[pts.length-1].y); };
    ctx.beginPath(); ctx.moveTo(pts[0].x, yAt(0)); ctx.lineTo(pts[0].x, pts[0].y);
    curve(ctx);
    ctx.lineTo(pts[pts.length-1].x, yAt(0)); ctx.closePath();
    ctx.fillStyle = s.color + '14'; ctx.fill();
    ctx.beginPath(); curve(ctx);
    ctx.strokeStyle = s.color; ctx.lineWidth = 3.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  });
  return canvas.toDataURL('image/png');
}

function pdfMostCommonCity(arr){
  const m = new Map();
  arr.forEach(t => { if(t.city) m.set(t.city, (m.get(t.city)||0)+1); });
  let best = null, bc = 0;
  for(const [c,n] of m){ if(n > bc || (n===bc && (!best || c.localeCompare(best,'pt')<0))){ best = c; bc = n; } }
  return best || '—';
}

function pdfBuildPanoramaRows(list){
  const total = list.length || 1;
  const cnt = { aberto:0, atendimento:0, analise:0, encerrado:0 };
  list.forEach(t => { if(cnt[t.status]!==undefined) cnt[t.status]++; });
  const groupOrder = [...new Set([...DEFAULT_TYPES, ...list.map(t=>t.type).filter(Boolean)])];
  const bodyRows = [];
  groupOrder.forEach(type => {
    const inType = list.filter(t => t.type === type);
    if(!inType.length) return;
    const st = { aberto:0, atendimento:0, analise:0, encerrado:0 };
    inType.forEach(t => { if(st[t.status]!==undefined) st[t.status]++; });
    bodyRows.push({ group:true, label:type.toUpperCase(), st, total:inType.length, pct:pdfPct(inType.length,total), city:pdfMostCommonCity(inType) });
    const subjects = [...new Set(inType.map(t=>t.subject).filter(Boolean))];
    const subAgg = subjects.map(s => {
      const arr = inType.filter(t=>t.subject===s);
      const s2 = { aberto:0, atendimento:0, analise:0, encerrado:0 };
      arr.forEach(t => { if(s2[t.status]!==undefined) s2[t.status]++; });
      return { group:false, label:s, st:s2, total:arr.length, pct:pdfPct(arr.length,total), city:pdfMostCommonCity(arr) };
    }).sort((a,b)=> b.total-a.total || a.label.localeCompare(b.label,'pt'));
    bodyRows.push(...subAgg);
  });
  return { bodyRows, cnt, total:list.length };
}

function pdfPanoramaTable(bodyRows){

      const vals = [r.st.aberto, r.st.atendimento, r.st.analise, r.st.encerrado, r.total];
      body.push([
        { text:r.label, bold:true, color:'#fff', fontSize:9, fillColor:PDFC.TEAL },

      ]);
      totals.aberto+=r.st.aberto; totals.atendimento+=r.st.atendimento; totals.analise+=r.st.analise; totals.encerrado+=r.st.encerrado; totals.total+=r.total;
    } else {
      const bg = (rowNum % 2) ? '#ffffff' : PDFC.LIGHT_GRAY;

      body.push([

  })));

function pdfTop5Subjects(list){
  const total = list.length || 1;
  const m = new Map();
  list.forEach(t => { const k = t.subject || '(sem assunto)'; m.set(k, (m.get(k)||0)+1); });
  const arr = [...m.entries()].sort((a,b)=>b[1]-a[1]);
  const top = arr.slice(0,4);
  const restCount = arr.slice(4).reduce((a,[,n])=>a+n,0);
  const rows = top.map(([k,n]) => [k, String(n), pdfPct(n,total)]);
  if(restCount) rows.push(['Outros', String(restCount), pdfPct(restCount,total)]);
  return rows;
}

function pdfTipoBuckets(list, rg){
  const step = rg.hourly ? 3600000 : 86400000;
  const buckets = [];
  for(let t = rg.start; t < rg.end; t += step) buckets.push({ t, ...Object.fromEntries(DEFAULT_TYPES.map(ty=>[ty,0])) });
  list.forEach(t => {
    const c = t.createdAt ? new Date(t.createdAt).getTime() : NaN;
    if(!(c>=rg.start && c<rg.end) || !buckets.length) return;
    const idx = Math.min(buckets.length-1, Math.floor((c-rg.start)/step));
    if(buckets[idx][t.type] !== undefined) buckets[idx][t.type]++;
  });
  const lbl = b => rg.hourly ? `${pad(new Date(b.t).getHours())}h` : dmy(new Date(b.t).toISOString()).slice(0,5);
  return DEFAULT_TYPES.map(ty => ({ label:ty, color:PDF_TYPE_COLOR[ty]||PDFC.GRAY, values:buckets.map(b=>({ x:lbl(b), y:b[ty]||0 })) }));
}

const dmyhm = iso => { const d=new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dmy = iso => { const d=new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
function rel(iso){
  if(!iso) return '';
  const m = Math.floor((Date.now() - new Date(iso).getTime())/60000);
  if(m < 1) return 'agora';
  if(m < 60) return `há ${m}min`;
  if(m < 1440) return `há ${Math.floor(m/60)}h`;
  if(m < 10080) return `há ${Math.floor(m/1440)}d`;
  return dmy(iso);
}

  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.remove(), 3800);
}
function confirmClick(btn, ask, fn){
  if(btn.dataset.armed){ fn(); return; }
  const old = btn.textContent; btn.dataset.armed='1'; btn.textContent = ask;
  setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent = old; } }, 3500);
}

/* ───────── armazenamento (Supabase: Postgres + Auth + Realtime) ───────── */
const t2r = t => ({          // ticket: camelCase (app) -> snake_case (banco)
  id:t.id, type:t.type, subject:t.subject, city:t.city||null, contact:t.contact||null, status:t.status,
  created_at:t.createdAt, created_by:t.createdBy||null, last_message_at:t.lastMessageAt||null,
  last_preview:t.lastPreview||null, last_side:t.lastSide||null, replies_by:t.repliesBy||{},
  closed_by:t.closedBy===undefined?undefined:t.closedBy, closed_at:t.closedAt===undefined?undefined:t.closedAt,
  awaiting_admin:!!t.awaitingAdmin
});
const r2t = r => ({ id:r.id, type:r.type, subject:r.subject, city:r.city, contact:r.contact, status:r.status,
  createdAt:r.created_at, createdBy:r.created_by, lastMessageAt:r.last_message_at, lastPreview:r.last_preview,
  lastSide:r.last_side, repliesBy:r.replies_by||{}, closedBy:r.closed_by, closedAt:r.closed_at,
  awaitingAdmin:!!r.awaiting_admin });
const m2r = (ticketId, m) => ({ ticket_id:ticketId, side:m.side, author:m.author||null, at:m.at, text:m.text||null, files:m.files||[] });
const r2m = r => ({ id:r.id, side:r.side, author:r.author, at:r.at, text:r.text, files:r.files||[] });
const p2u = r => ({ id:r.id, user:r.username, name:r.name, role:r.role, disabled:r.disabled, disabledAt:r.disabled_at, disabledBy:r.disabled_by, createdBy:r.created_by, createdAt:r.created_at });

function poll(loadFn, intervalMs){
  let stopped = false;
  const tick = async () => { if(stopped) return; try{ await loadFn(); }catch(_){} if(!stopped) setTimeout(tick, intervalMs); };
  tick();
  return () => { stopped = true; };
}

const store = {
  watchTickets(cb){
    const load = async () => { try{ const data = await selectAll('tickets'); cb(data.map(r2t)); }catch(_){ setBanner('Não foi possível carregar os chamados.'); } };
    return poll(load, 5000);
  },
  watchMessages(id, cb){
    const load = async () => { try{ const data = await selectAll('messages', `ticket_id=eq.${encodeURIComponent(id)}&order=at`); cb(data.map(r2m)); }catch(_){ setBanner('Não foi possível carregar a conversa.'); } };
    return poll(load, 3000);
  },
  async getMessages(id){
    const data = await selectAll('messages', `ticket_id=eq.${encodeURIComponent(id)}&order=at`); return data.map(r2m);
  },
  async setTicket(t){ await insertRow('tickets', t2r(t)); },
  async patchTicket(id, patch){
    const row = {}; for(const k in patch){ row[({createdAt:'created_at',createdBy:'created_by',lastMessageAt:'last_message_at',lastPreview:'last_preview',lastSide:'last_side',repliesBy:'replies_by',closedBy:'closed_by',closedAt:'closed_at',awaitingAdmin:'awaiting_admin'})[k] || k] = patch[k]; }
    await updateRows('tickets', `id=eq.${encodeURIComponent(id)}`, row);
  },
  async addMessage(id, m){ const row = await insertRow('messages', m2r(id, m)); return row?.id; },
  async delMessage(id, mid){ await deleteRows('messages', `id=eq.${encodeURIComponent(mid)}`); },
  async delTicket(id){ await deleteRows('tickets', `id=eq.${encodeURIComponent(id)}`); },
  async getUser(u){
    const row = await selectOne('profiles', `username=eq.${encodeURIComponent(u)}`);
    return row ? p2u(row) : null;
  },
  watchUsers(cb){
    const load = async () => { try{ const data = await selectAll('profiles'); cb(data.map(p2u)); }catch(_){} };
    return poll(load, 5000);
  },
  async listUsers(){ try{ const data = await selectAll('profiles'); return data.map(p2u); }catch(_){ return []; } },
  async createUser({ user, name, role, password }){
    const email = usernameToEmail(user);
    let out;
    try{ out = await adminApi.createUser(email, password, name); }
    catch(e){ throw new Error(/already|exist/i.test(e.message||'') ? 'Este usuário já existe.' : (e.message || 'Não foi possível cadastrar.')); }
    const uid = out?.user?.id; if(!uid) throw new Error('Não foi possível cadastrar.');
    try{ await insertRow('profiles', { id:uid, username:user, name, role: role==='admin'?'admin':'atendente', created_by: me.user }); }
    catch(e){ try{ await adminApi.removeUser(uid); }catch(_){} throw e; }
  },
  async setPassword(user, password, currentPassword){
    if(user === me.user){ await authFetch('/change-password', { method:'POST', body:{ currentPassword: currentPassword||'', newPassword: password, revokeOtherSessions:false } }); }
    else { const rec = await this.getUser(user); if(!rec) throw new Error('Usuário não encontrado.'); await adminApi.setUserPassword(rec.id, password); }
  },
  async toggleUser(rec, disabled){
    await updateRows('profiles', `username=eq.${encodeURIComponent(rec.user)}`, { disabled, disabled_at: disabled ? new Date().toISOString() : null, disabled_by: disabled ? me.user : null });
  },
  async delUser(u){
    const rec = await this.getUser(u); if(!rec) throw new Error('Usuário não encontrado.');
    await adminApi.removeUser(rec.id);
  },
  watchCatalog(cb){
    const norm = d => ({ subjects:Array.isArray(d?.subjects)?d.subjects:[], cities:Array.isArray(d?.cities)?d.cities:[], cityUF:(d?.city_uf && typeof d.city_uf==='object')?d.city_uf:{}, types:Array.isArray(d?.types)?d.types:DEFAULT_TYPES.slice() });
    const load = async () => { try{ const row = await selectOne('catalog', 'id=eq.1'); cb(norm(row)); }catch(_){} };
    return poll(load, 8000);
  },
  async saveCatalog(c){
    await updateRows('catalog', 'id=eq.1', { subjects:c.subjects, cities:c.cities, city_uf:c.cityUF||{}, types:c.types||[] });
  },
  async putFile(id, obj){ await insertRow('files', { id, name:obj.name, type:obj.type, size:obj.size, data:obj.data }); },
  async getFile(id){ return await selectOne('files', `id=eq.${encodeURIComponent(id)}`); },
  async next(){
    const out = await rpcCall('next_protocol', {});
    if(typeof out === 'string') return out;
    if(Array.isArray(out)) return typeof out[0] === 'string' ? out[0] : (out[0]?.next_protocol ?? out[0]);
    return out?.next_protocol ?? out;
  }
};

function viewLogin(){
  $('#app').innerHTML = `
  <div class="login2">
    <div class="login2-photo">
      <img class="login2-bg" src="${LOGIN_PHOTO_SRC}" alt="">
      <div class="login2-veil"></div>
      <div class="login2-caption">
        <span class="eyebrow">Boa Vista</span>
        <h2>Transporte que faz acontecer</h2>
      </div>
    </div>
    <div class="login2-panel">
      ${themeBtn('icon-btn theme-fab login2-theme')}
      <form class="login2-form" id="lf" autocomplete="on">
        <div class="brandmark2">
          <img class="sac-lockup2" src="${SAC_LOCKUP_SRC}" alt="SAC">
          <img class="logo2" src="${LOGO_WHITE_SRC}" alt="Boa Vista">
        </div>
        <h1>Entrar no Suporte</h1><p>Acesso da equipe de atendimento.</p>
        <div class="field"><label for="lu">Usuário</label><input class="inp" id="lu" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
        <div class="field"><label for="lp">Senha</label><input class="inp" id="lp" name="password" type="password" autocomplete="current-password" required></div>
        <div class="err" id="le" role="alert"></div>
        <button class="btn primary block" type="submit">Entrar</button>
        <div class="fine">Versão de teste</div>

  </div>`;
  $('#lf').addEventListener('submit', async e => {
    e.preventDefault();
    const u = $('#lu').value.trim().toLowerCase(), p = $('#lp').value, err = $('#le'); err.textContent = '';
    if(!/^[a-z][a-z0-9._-]{2,29}$/.test(u)){ err.textContent = 'Usuário ou senha incorretos.'; return; }
    try{
      await signIn(u, p);
    }catch(_){ err.textContent = 'Usuário ou senha incorretos.'; return; }
    try{
      const rec = await store.getUser(u);
      if(!rec){ err.textContent = 'Usuário ou senha incorretos.'; await signOutAuth(); return; }
      if(rec.disabled){ err.textContent = 'Este perfil está desativado. Fale com a administradora.'; await signOutAuth(); return; }
      me = { user:rec.user, name:rec.name, role:rec.role };
    }catch(_){ err.textContent = 'Não foi possível entrar agora. Tente de novo.'; return; }
    start();
  });
  wireThemeBtns();
  setTimeout(()=>$('#lu')?.focus(), 30);
}
function logout(){
  signOutAuth().catch(()=>{});
  me = null; closeAll(); if(unsubT){ unsubT(); unsubT=null; } if(unsubC){ unsubC(); unsubC=null; } tickets = [];
  viewLogin();
}

  if(unsubT) unsubT();

const titleName = n => n.toLowerCase().split(' ').filter(Boolean).map((w,i)=> (i>0 && ['de','da','do','dos','das'].includes(w)) ? w : w[0].toUpperCase()+w.slice(1)).slice(0,2).join(' ');

function renderList(){
  if(!$('#rows')) return;
  let t1 = f.d1 ? new Date(f.d1+'T00:00:00').getTime() : -Infinity, t2 = f.d2 ? new Date(f.d2+'T00:00:00').getTime()+86400000 : Infinity;
  if(f.d1 && f.d2 && t2 - 86400000 < t1){ const x = t1; t1 = t2 - 86400000; t2 = x + 86400000; }
  const inDate = t => { if(t1 === -Infinity && t2 === Infinity) return true; const c = t.createdAt ? new Date(t.createdAt).getTime() : NaN; return c >= t1 && c < t2; };
  const q = f.q.trim().toLowerCase();
  // base: tudo menos o status (os indicadores acompanham data, busca, tipo e cidade)
  const base = tickets.filter(t => inDate(t) && (!f.type || t.type===f.type) && (!f.city || t.city===f.city) &&
    (!q || [t.id,t.subject,t.city,t.contact].some(x => String(x||'').toLowerCase().includes(q))));
  const cnt = {aberto:0, atendimento:0, analise:0, encerrado:0};
  base.forEach(t => { if(cnt[t.status]!==undefined) cnt[t.status]++; });
  const awaiting = base.filter(t => t.status!=='encerrado' && t.lastSide==='client').length;
  $('#stats').innerHTML = STATUS_ORDER.map(k =>
    `<button class="stat" data-st="${k}" aria-pressed="${f.status===k}"><span class="n">${cnt[k]}</span><span class="l"><span class="dot ${k}"></span>${STATUS_PLURAL[k]}</span></button>`).join('');
  const filtered = !!(f.d1 || f.d2 || f.type || f.city || q);
  $('#sub').textContent = filtered ? `${base.length} chamado${base.length===1?'':'s'} na seleção` + (awaiting ? ` · ${awaiting} aguardando resposta` : '')
    : (awaiting ? `${awaiting} chamado${awaiting>1?'s':''} aguardando resposta` : 'Nenhum chamado aguardando resposta');
  const cities = [...new Set([...catalog.cities, ...tickets.map(t=>t.city).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'pt'));
  const typeNames = [...new Set([...catalog.types, ...tickets.map(t=>t.type).filter(Boolean)])];
  $('#ft').innerHTML = '<option value="">Todos os tipos</option>' + typeNames.map(t=>`<option ${t===f.type?'selected':''}>${esc(t)}</option>`).join('');
  const fc = $('#fc'); const cur = f.city;
  fc.innerHTML = '<option value="">Todas as cidades</option>' + cities.map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('');
  const list = base.filter(t => !f.status || t.status===f.status)
    .sort((a,b) => String(b.lastMessageAt).localeCompare(String(a.lastMessageAt)));
  $('#rows').innerHTML = list.map(t => `<tr data-id="${esc(t.id)}" tabindex="0">
    <td class="proto">${esc(t.id)}</td>
    <td class="when">${t.createdAt ? dmyhm(t.createdAt) : '—'}</td>
    <td class="city">${esc(t.city || '—')}</td>
    <td><span class="pill type-${TYPE_SLUG[t.type]||'duvida'}">${esc(t.type)}</span></td>
    <td class="subj"><div class="s1">${esc(t.subject)}${t.example?'<span class="ex">exemplo</span>':''}${t.awaitingAdmin?'<span class="pill flag mini">Aguardando administrador(a)</span>':''}</div><div class="s2">${esc(t.lastPreview||'')}</div></td>
    <td><span class="pill st st-${t.status}">${STATUS[t.status]||''}</span></td>
    <td class="when">${rel(t.lastMessageAt)}</td>
    <td class="open"><button class="link" tabindex="-1">Abrir</button></td></tr>`).join('');
  $('#empty').hidden = list.length > 0;
}

/* ───────── camadas (modais) ───────── */
function layer(html, cls=''){
  const o = document.createElement('div'); o.className='overlay'; o.setAttribute('role','dialog'); o.setAttribute('aria-modal','true');
  o.innerHTML = `<div class="modal ${cls}">${html}</div>`;
  $('#layer').appendChild(o);
  o.addEventListener('mousedown', e => { if(e.target===o) o._close?.(); });
  return o;
}
function closeAll(){ if(open){ open.unsub?.(); open=null; } $('#layer').innerHTML=''; }
document.addEventListener('keydown', e => { if(e.key==='Escape'){ const ls=[...document.querySelectorAll('.overlay')]; const top=ls[ls.length-1]; top?._close?.(); } });

function showMe(){
  const o = layer(`<div class="m-head"><h2>Meus dados</h2><button class="x" aria-label="Fechar">${ic('x')}</button></div>
  <dl class="data"><dt>Nome</dt><dd>${esc(me.name)}</dd><dt>Usuário</dt><dd>${esc(me.user)}</dd><dt>Perfil</dt><dd style="display:flex;align-items:center;gap:6px;color:var(--blue-text)">${ic(isAdmin()?'shield':'user')}${ROLE_LABEL[me.role]||'Atendente'}</dd></dl>
  <div class="m-foot"><button class="btn" id="mpw">Alterar senha</button><button class="btn" data-c>Fechar</button></div>`, 'sm');
  o._close = () => o.remove(); o.querySelectorAll('.x,[data-c]').forEach(b=>b.onclick=o._close);
  $('#mpw', o).onclick = () => { o.remove(); openPassword(); };
}
function openPassword(){
  const o = layer(`<div class="m-head"><h2>Alterar senha</h2><div class="meta">Vale para o seu usuário (${esc(me.user)}).</div><button class="x" aria-label="Fechar">${ic('x')}</button></div>
  <form id="pf" autocomplete="off" style="display:flex;flex-direction:column;min-height:0"><div class="form-body">
    <div class="field"><label for="pc">Senha atual</label><input class="inp" id="pc" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="pn">Nova senha</label><input class="inp" id="pn" type="password" autocomplete="new-password" minlength="6" maxlength="60" required></div>
    <div class="field"><label for="pr">Repita a nova senha</label><input class="inp" id="pr" type="password" autocomplete="new-password" required></div>
    <div class="err" id="pe" role="alert"></div>
  </div><div class="m-foot"><button class="btn" type="button" data-c>Cancelar</button><button class="btn primary" type="submit" id="pb">Salvar senha</button></div></form>`, 'sm');
  o._close = () => o.remove(); o.querySelectorAll('.x,[data-c]').forEach(b=>b.onclick=o._close);
  $('#pf', o).onsubmit = async e => {
    e.preventDefault(); const err = $('#pe', o); err.textContent = '';
    const cur = $('#pc', o).value, nw = $('#pn', o).value, rp = $('#pr', o).value;
    if(nw.length < 6){ err.textContent = 'A nova senha precisa ter pelo menos 6 caracteres.'; return; }
    if(nw !== rp){ err.textContent = 'As duas senhas digitadas são diferentes.'; return; }
    if(nw === cur){ err.textContent = 'A nova senha deve ser diferente da atual.'; return; }
    const btn = $('#pb', o); btn.disabled = true;
    try{
      const okCur = await verifyPassword(me.user, cur);
      if(!okCur){ err.textContent = 'A senha atual está incorreta.'; btn.disabled = false; return; }
      await store.setPassword(me.user, nw, cur);
      o.remove(); toast('Senha alterada.');
    }catch(_){ err.textContent = 'Não foi possível salvar. Tente de novo.'; btn.disabled = false; }
  };
  setTimeout(()=>$('#pc', o).focus(), 30);
}

/* ───────── relatório (somente administradora) ───────── */
function openReport(){
  if(!isAdmin()) return;
  const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  let mode = '30', d1 = todayStr(), d2 = todayStr(), usersList = [];
  const o = layer(`<div class="m-head no-print"><h2>Relatório de atendimento</h2><div class="meta" id="rmeta"></div><button class="x" aria-label="Fechar">${ic('x')}</button></div>
    <div class="m-body rep" id="repBody"></div><div class="m-foot no-print"><button class="btn" data-c>Fechar</button></div>`, 'wide');
  let unsub = null;
  o._close = () => { unsub?.(); o.remove(); };
  o.querySelectorAll('.x,[data-c]').forEach(b=>b.onclick=o._close);
  const body = $('#repBody', o);
  const nameOf = new Map();
  const who = u => nameOf.get(u) ? titleName(nameOf.get(u)) : u;
  const localDay = v => new Date(v + 'T00:00:00');
  function range(){
    if(mode === 'dia'){ const s0 = localDay(d1 || todayStr()); return { start:s0.getTime(), end:s0.getTime()+86400000, label:`Chamados registrados em ${dmy(s0.toISOString())}` }; }
    if(mode === 'intervalo'){
      let a = localDay(d1 || todayStr()), b = localDay(d2 || todayStr()); if(b < a) [a,b] = [b,a];
      return { start:a.getTime(), end:b.getTime()+86400000, label:`Chamados registrados de ${dmy(a.toISOString())} a ${dmy(b.toISOString())}` };
    }
    const n = +mode, end = Date.now(), start = end - n*86400000;
    return { start, end:end+1, label:`Chamados registrados de ${dmy(new Date(start).toISOString())} a ${dmy(new Date(end).toISOString())}` };
  }
  // controles (ficam fixos; só o resultado é redesenhado)
  body.innerHTML = `<div class="rep-head no-print"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label for="rmode" class="note" style="margin:0">Período</label>
      <select class="inp" id="rmode" style="width:auto"><option value="7">Últimos 7 dias</option><option value="30" selected>Últimos 30 dias</option><option value="90">Últimos 90 dias</option><option value="dia">Um dia específico</option><option value="intervalo">Intervalo de datas</option></select>
      <span id="rdates" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap" hidden>
        <input class="inp" id="rd1" type="date" style="width:auto" aria-label="Data"><span id="rsep" class="note" style="margin:0">até</span><input class="inp" id="rd2" type="date" style="width:auto" aria-label="Data final">
      </span><span class="sp" style="flex:1"></span><button class="btn" id="rPrint" type="button">Exportar em PDF</button></div></div><div id="repRes"></div>`;
  $('#rd1', o).value = d1; $('#rd2', o).value = d2;
  $('#rPrint', o).onclick = () => exportProdutividadePDF(o);
  const syncControls = () => { $('#rdates', o).hidden = !(mode==='dia' || mode==='intervalo'); $('#rd2', o).hidden = $('#rsep', o).hidden = mode !== 'intervalo'; };
  $('#rmode', o).onchange = e => { mode = e.target.value; syncControls(); draw(); };
  $('#rd1', o).onchange = e => { d1 = e.target.value; draw(); };
  $('#rd2', o).onchange = e => { d2 = e.target.value; draw(); };
  syncControls();
  function draw(){
    usersList.forEach(u => nameOf.set(u.user, u.name));
    const off = new Set(usersList.filter(u => u.disabled).map(u => u.user));
    const { start, end, label } = range();
    $('#rmeta', o).textContent = label;
    const inRange = tickets.filter(t => { const c = t.createdAt ? new Date(t.createdAt).getTime() : NaN; return c >= start && c < end; })
      .sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    const cnt = { aberto:0, atendimento:0, analise:0, encerrado:0 };
    inRange.forEach(t => { if(cnt[t.status] !== undefined) cnt[t.status]++; });
    const rows = new Map();
    const row = u => { if(!rows.has(u)) rows.set(u, { u, reg:0, atend:0, resp:0, enc:0 }); return rows.get(u); };
    usersList.map(u=>u.user).forEach(row);
    inRange.forEach(t => {
      if(t.createdBy) row(t.createdBy).reg++;
      for(const [u,n] of Object.entries(t.repliesBy || {})) if(n > 0){ const r = row(u); r.atend++; r.resp += n; }
      if(t.status === 'encerrado' && t.closedBy) row(t.closedBy).enc++;
    });
    const people = [...rows.values()].sort((a,b) => b.atend - a.atend || b.resp - a.resp || b.reg - a.reg || a.u.localeCompare(b.u));
    const subj = new Map();
    inRange.forEach(t => { const k = t.subject || '(sem assunto)'; if(!subj.has(k)) subj.set(k, { k, aberto:0, atendimento:0, analise:0, encerrado:0, total:0 }); const r = subj.get(k); r[t.status]++; r.total++; });
    const subjects = [...subj.values()].sort((a,b) => b.total - a.total || a.k.localeCompare(b.k,'pt'));
    const max = Math.max(1, ...subjects.map(s => s.total));
    const LIMIT = 300, shown = inRange.slice(0, LIMIT);
    $('#repRes', o).innerHTML = `
      <div class="rep-tiles">
        <div class="rep-tile"><div class="n">${inRange.length}</div><div class="l">Registrados</div></div>
        <div class="rep-tile"><div class="n">${cnt.atendimento + cnt.analise + cnt.encerrado}</div><div class="l">Atendidos</div></div>
        <div class="rep-tile"><div class="n">${cnt.encerrado}</div><div class="l">Encerrados</div></div>
        <div class="rep-tile"><div class="n">${cnt.aberto}</div><div class="l">Sem resposta</div></div>
      </div>
      <h3>Por atendente</h3>
      <div class="rep-scroll"><table class="rep-tbl"><thead><tr><th>Atendente</th><th class="n">Registrados</th><th class="n">Chamados respondidos</th><th class="n">Respostas enviadas</th><th class="n">Encerrados</th></tr></thead><tbody>
        ${people.map(r => `<tr data-u="${esc(r.u)}" style="cursor:pointer" title="Ver tudo o que ${esc(who(r.u))} fez"><td><div style="font-weight:500">${esc(who(r.u))}${off.has(r.u) ? ' <span class="pill" style="font-size:11px">Desativado</span>' : ''} <span class="linkbtn" style="font-weight:400">ver atividade ›</span></div><div class="note" style="margin:0">${esc(r.u)}</div></td><td class="n">${r.reg}</td><td class="n">${r.atend}</td><td class="n">${r.resp}</td><td class="n">${r.enc}</td></tr>`).join('')}
      </tbody></table></div>
      <h3>Por assunto</h3>
      ${subjects.length ? `<div class="rep-scroll"><table class="rep-tbl"><thead><tr><th>Assunto</th><th class="n">Total</th><th style="width:38%">Situação</th></tr></thead><tbody>
        ${subjects.map(s => `<tr><td>${esc(s.k)}</td><td class="n">${s.total}</td><td><div class="sbar" style="width:${Math.max(8, Math.round(s.total/max*100))}%" title="Abertos ${s.aberto} · Em atendimento ${s.atendimento} · Em análise ${s.analise} · Encerrados ${s.encerrado}"><i class="b1" style="width:${s.aberto/s.total*100}%"></i><i class="b2" style="width:${s.atendimento/s.total*100}%"></i><i class="b4" style="width:${s.analise/s.total*100}%"></i><i class="b3" style="width:${s.encerrado/s.total*100}%"></i></div></td></tr>`).join('')}
      </tbody></table></div><div class="legend"><span>Aberto</span><span class="l2">Em atendimento</span><span class="l4">Em análise</span><span class="l3">Encerrado</span></div>` : '<p class="note">Nenhum chamado registrado no período.</p>'}
      <h3>Chamados do período${inRange.length ? ` (${inRange.length})` : ''}</h3>
      ${shown.length ? `<div class="rep-scroll"><table class="rep-tbl" style="min-width:760px"><thead><tr><th>Protocolo</th><th>Registrado em</th><th>Assunto</th><th>Registrado por</th><th>Respondido por</th><th>Status</th><th></th></tr></thead><tbody>
        ${shown.map(t => { const resp = Object.keys(t.repliesBy||{}).filter(u => t.repliesBy[u] > 0).map(who).join(', ');
          return `<tr data-t="${esc(t.id)}" style="cursor:pointer"><td><button class="linkbtn proto" data-open="${esc(t.id)}" style="font-family:var(--mono)">${esc(t.id)}</button></td><td style="white-space:nowrap">${dmyhm(t.createdAt)}</td><td>${esc(t.subject)}</td><td>${esc(t.createdBy ? who(t.createdBy) : '—')}</td><td>${esc(resp || '—')}</td><td><span class="pill st st-${t.status}">${STATUS[t.status]||''}</span></td><td><button class="linkbtn" data-copy="${esc(t.id)}" style="white-space:nowrap">Copiar link</button></td></tr>`; }).join('')}
      </tbody></table></div>${inRange.length > LIMIT ? `<p class="note">Mostrando os ${LIMIT} mais recentes. Reduza o período para ver os demais.</p>` : ''}` : '<p class="note">Nenhum chamado registrado no período.</p>'}
      <p class="note" style="margin-top:16px">Considera os chamados <b>registrados</b> no período. <b>Registrados</b>: quem cadastrou o chamado. <b>Chamados respondidos</b>: chamados em que a pessoa enviou ao menos uma resposta. <b>Encerrados</b>: chamados que a pessoa encerrou (se for reaberto, deixa de contar).</p>`;
    $('#repRes', o).querySelectorAll('[data-copy]').forEach(b => b.onclick = e => { e.stopPropagation(); copyLink(b.dataset.copy); });
    $('#repRes', o).querySelectorAll('tr[data-u]').forEach(tr => tr.onclick = () => openActivity(tr.dataset.u, who(tr.dataset.u), range()));
    $('#repRes', o).querySelectorAll('tr[data-t]').forEach(tr => tr.onclick = () => openTicket(tr.dataset.t));
  }
  unsub = store.watchUsers(l => { usersList = l.map(({id,...r}) => r); draw(); });
  draw();
}

  function draw(){

    body.innerHTML = `<div class="rep-head"><label class="note" style="margin:0;display:flex;gap:8px;align-items:center"><input type="checkbox" id="acAll" ${all?'checked':''}> Mostrar todo o histórico (ignorar o período do relatório)</label></div>
      <p class="note">${all ? 'Todo o histórico.' : esc(rg.label.replace('Chamados registrados','Chamados registrados')) + ' — mesma base dos números do relatório.'}</p>

        <div class="rep-tile"><div class="n">${c('reg')}</div><div class="l">Chamados registrados</div></div>
        <div class="rep-tile"><div class="n">${c('reply')}</div><div class="l">Respostas enviadas</div></div>
        <div class="rep-tile"><div class="n">${closed}</div><div class="l">Encerramentos</div></div>
        <div class="rep-tile"><div class="n">${reopened}</div><div class="l">Reaberturas</div></div>
      </div>
      ${atts ? `<p class="note">${atts} anexo(s) enviados.</p>` : ''}
      <h3>Linha do tempo (${list.length})</h3>
      ${list.length ? `<div class="rep-scroll"><table class="rep-tbl" style="min-width:680px"><thead><tr><th>Data e hora</th><th>Ação</th><th>Chamado</th><th>Detalhe</th></tr></thead><tbody>
        ${list.slice(0,500).map(e => { const t = byId.get(e.id) || {};
          const det = e.k==='reg' ? `${esc(t.type||'')} · ${esc(t.subject||'')}${t.city?' · '+esc(t.city):''}` : esc((e.text||'').slice(0,240)) + ((e.text||'').length>240?'…':'') + (e.files?.length ? ` <span class="note" style="margin:0">(${e.files.length} anexo)</span>` : '');
          return `<tr><td style="white-space:nowrap">${dmyhm(e.at)}</td><td>${KIND[e.k]}</td><td><button class="linkbtn proto" data-open="${esc(e.id)}" style="font-family:var(--mono)">${esc(e.id)}</button></td><td style="white-space:normal">${det}</td></tr>`; }).join('')}
      </tbody></table></div>${list.length>500?'<p class="note">Mostrando os 500 mais recentes.</p>':''}` : '<p class="note">Nenhuma atividade encontrada.</p>'}`;
    $('#acAll', o).onchange = e => { all = e.target.checked; draw(); };
    body.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openTicket(b.dataset.open));
  }
  (async () => {
    const ts = tickets.slice(); byId = new Map(ts.map(t => [t.id, t]));
    
    const lists = await Promise.all(ts.map(t => store.getMessages(t.id).then(m => [t, m]).catch(() => [t, []])));
    for(const [t, ms] of lists){
      if(t.createdBy === user) evs.push({ k:'reg', id:t.id, at:t.createdAt });
      for(const m of ms){
        if(m.author !== user) continue;
        if(m.side === 'staff') evs.push({ k:'reply', id:t.id, at:m.at, text:m.text, files:m.files });
        else if(m.side === 'system') evs.push({ k:'sys', id:t.id, at:m.at, text:m.text });
      }
    }
    ready = true; if(o.isConnected) draw();
  })();

const UF_LIST = BR_MAP.map(s => s.i);
const UF_NAME = Object.fromEntries(BR_MAP.map(s => [s.i, s.n]));
function periodRange(mode, d1, d2){
  const mid = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
  const day = v => new Date(v + 'T00:00:00');
  const fmt = d => dmy(d.toISOString());
  if(mode === 'dia'){ const a = day(d1); return { start:a.getTime(), end:a.getTime()+86400000, hourly:true, label:`Dia ${fmt(a)}` }; }
  if(mode === 'intervalo'){ let a = day(d1), b = day(d2); if(b < a) [a,b] = [b,a]; return { start:a.getTime(), end:b.getTime()+86400000, label:`${fmt(a)} a ${fmt(b)}` }; }
  const n = +mode, e = mid(new Date()), a = new Date(e); a.setDate(a.getDate() - (n-1));
  const end = new Date(e); end.setDate(end.getDate()+1);
  return { start:a.getTime(), end:end.getTime(), label:`Últimos ${n} dias (${fmt(a)} a ${fmt(e)})` };
}
function smoothPath(pts){          // interpolação monotônica (sem "ondas" falsas entre pontos)
  const n = pts.length; if(n < 2) return pts.length ? `M${pts[0][0]},${pts[0][1]}` : '';
  const dx = [], m = [], t = [];
  for(let i=0;i<n-1;i++){ dx[i] = pts[i+1][0]-pts[i][0]; m[i] = (pts[i+1][1]-pts[i][1])/(dx[i]||1); }
  t[0] = m[0]; t[n-1] = m[n-2];
  for(let i=1;i<n-1;i++) t[i] = m[i-1]*m[i] <= 0 ? 0 : (m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){ if(m[i] === 0){ t[i] = t[i+1] = 0; continue; } const a = t[i]/m[i], b = t[i+1]/m[i], h = Math.hypot(a,b); if(h > 3){ t[i] = 3*a/h*m[i]; t[i+1] = 3*b/h*m[i]; } }
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){ const x1 = pts[i][0]+dx[i]/3, x2 = pts[i+1][0]-dx[i]/3; d += `C${x1.toFixed(1)},${(pts[i][1]+t[i]*dx[i]/3).toFixed(1)} ${x2.toFixed(1)},${(pts[i+1][1]-t[i+1]*dx[i]/3).toFixed(1)} ${pts[i+1][0].toFixed(1)},${pts[i+1][1].toFixed(1)}`; }
  return d;
}
function openPanorama(){
  if(!isAdmin()) return;
  const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  let mode = '30', d1 = todayStr(), d2 = todayStr(), pieBy = 'subject', selUF = null;

  body.innerHTML = `<div class="rep-head no-print"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">

      <select class="inp" id="pmode" style="width:auto"><option value="7">Últimos 7 dias</option><option value="30" selected>Últimos 30 dias</option><option value="90">Últimos 90 dias</option><option value="dia">Um dia específico</option><option value="intervalo">Intervalo de datas</option></select>
      <span id="pdates" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap" hidden><input class="inp" id="pd1" type="date" style="width:auto" aria-label="Data"><span id="psep" class="note" style="margin:0">até</span><input class="inp" id="pd2" type="date" style="width:auto" aria-label="Data final"></span></div>
      <span class="sp" style="flex:1"></span><button class="btn" id="pPrint" type="button">Exportar em PDF</button></div>
    <div id="panRes"></div><div class="pan-tip" id="ptip" hidden></div>`;
  $('#pPrint', o).onclick = () => exportPanoramaPDF(o);
  $('#pd1', o).value = d1; $('#pd2', o).value = d2;
  const sync = () => { $('#pdates', o).hidden = !(mode==='dia'||mode==='intervalo'); $('#pd2', o).hidden = $('#psep', o).hidden = mode !== 'intervalo'; };
  $('#pmode', o).onchange = e => { mode = e.target.value; sync(); draw(); };
  $('#pd1', o).onchange = e => { d1 = e.target.value; draw(); };
  $('#pd2', o).onchange = e => { d2 = e.target.value; draw(); };

    const r = body.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = ev.clientX - r.left + body.scrollLeft + 14, y = ev.clientY - r.top + body.scrollTop - th - 12;
    if(x + tw > body.scrollWidth - 8) x = ev.clientX - r.left + body.scrollLeft - tw - 14;

  };
  const hideTip = () => { tip.hidden = true; };
  const cityUF = () => catalog.cityUF || {};
  function draw(){
    const rg = periodRange(mode, d1 || todayStr(), d2 || todayStr());
    $('#pmeta', o).textContent = rg.label;
    const inR = ts => ts >= rg.start && ts < rg.end;
    const tk = t => t.createdAt ? new Date(t.createdAt).getTime() : NaN;
    const list = tickets.filter(t => inR(tk(t)));
    const cnt = { aberto:0, atendimento:0, analise:0, encerrado:0 }; list.forEach(t => { if(cnt[t.status] !== undefined) cnt[t.status]++; });
    /* mapa: por estado */
    const byUF = {}, cityByUF = {}; let semUF = 0, semCidade = 0;
    list.forEach(t => {
      if(!t.city){ semCidade++; return; }
      const uf = cityUF()[t.city]; if(!uf || !UF_NAME[uf]){ semUF++; return; }
      byUF[uf] = (byUF[uf]||0) + 1; ((cityByUF[uf] = cityByUF[uf] || {})[t.city] = cityByUF[uf][t.city] || []).push(t);
    });
    const maxUF = Math.max(1, ...Object.values(byUF));
    const nUF = Object.keys(byUF).length;
    if(selUF && !byUF[selUF]) selUF = null;
    /* pizza */
    const catIdx = (arr, v) => Math.max(0, arr.indexOf(v));
    let slices = [];
    if(pieBy === 'status'){ slices = [['aberto','Aberto','var(--blue)'],['atendimento','Em atendimento','var(--amber)'],['analise','Em análise','var(--violet)'],['encerrado','Encerrado','var(--green)']].map(([k,n,c]) => ({ name:n, color:c, n:cnt[k] })); }
    else {

      const names = [...new Set([...(fld==='type' ? catalog.types : catalog.subjects), ...list.map(t => t[fld])])].filter(Boolean);

      const head = all.filter(s => s.ix < 7), tail = all.filter(s => s.ix >= 7 && s.n);
      slices = head.concat(tail.length ? [{ name:'Outros', color:'var(--sO)', n:tail.reduce((a,s)=>a+s.n,0) }] : []);
    }
    slices = slices.filter(s => s.n > 0).sort((a,b) => b.n - a.n);
    const total = slices.reduce((a,s)=>a+s.n,0);
    /* linhas por dia (ou por hora, se for um dia só) */
    const buckets = []; const step = rg.hourly ? 3600000 : 86400000;
    for(let t = rg.start; t < rg.end; t += step) buckets.push({ t, reg:0, enc:0 });
    tickets.forEach(t => {
      const c = tk(t); if(inR(c)) buckets[Math.min(buckets.length-1, Math.floor((c-rg.start)/step))].reg++;
      if(t.status === 'encerrado' && t.closedAt){ const e = new Date(t.closedAt).getTime(); if(inR(e)) buckets[Math.min(buckets.length-1, Math.floor((e-rg.start)/step))].enc++; }
    });
    const totReg = buckets.reduce((a,b)=>a+b.reg,0), totEnc = buckets.reduce((a,b)=>a+b.enc,0);
    const ymax = Math.max(4, ...buckets.map(b => Math.max(b.reg,b.enc))), yTop = ymax <= 4 ? 4 : Math.ceil(ymax/4)*4;
    const W = 760, H = 250, L = 34, R = 78, T = 12, B = 26, iw = W-L-R, ih = H-T-B;
    const X = i => L + (buckets.length > 1 ? i/(buckets.length-1)*iw : iw/2), Y = v => T + ih - v/yTop*ih;

        </section>
      </div>
      ${selUF ? `<section class="pan-card pan-wide" id="ufDet" aria-label="Chamados em ${esc(UF_NAME[selUF])}">
